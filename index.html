<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 3D Automático (.OBJ + .MTL)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #18181b;
            color: #f4f4f5;
        }
        #panel {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 10;
            background: rgba(24, 24, 27, 0.88);
            backdrop-filter: blur(6px);
            padding: 16px 20px;
            border-radius: 10px;
            border: 1px solid #3f3f46;
            max-width: 320px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        h3 { margin: 0 0 8px 0; font-size: 16px; color: #38bdf8; }
        p { margin: 0 0 12px 0; font-size: 13px; color: #a1a1aa; line-height: 1.4; }
        #status {
            margin-top: 10px;
            font-size: 12px;
            color: #4ade80;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="panel">
        <h3>Visor 3D Automático</h3>
        <p>Cargando modelo predeterminado del taller... También podés arrastrar otros archivos .obj/.mtl aquí.</p>
        <div id="status">Iniciando carga automática...</div>
    </div>

    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls, currentMesh;
        const statusEl = document.getElementById('status');

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x202025);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 4, 6);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Iluminación
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.1);
            dirLight1.position.set(6, 10, 8);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
            dirLight2.position.set(-6, 5, -6);
            scene.add(dirLight2);

            // Grilla de referencia (1 cuadro = 1 metro)
            const gridHelper = new THREE.GridHelper(10, 10, 0x52525b, 0x3f3f46);
            gridHelper.position.y = -0.101;
            scene.add(gridHelper);

            // CARGA AUTOMÁTICA AL ABRIR LA PÁGINA
            loadDefaultModel('taller_1er_ano_tecnica.obj', 'taller_1er_ano_tecnica.mtl');

            // Soporte para arrastrar y soltar nuevos archivos si se desea
            window.addEventListener('dragover', (e) => e.preventDefault());
            window.addEventListener('drop', (e) => {
                e.preventDefault();
                if (e.dataTransfer.files.length > 0) {
                    processFiles(e.dataTransfer.files);
                }
            });

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // Función para cargar los archivos predeterminados del servidor/GitHub
        function loadDefaultModel(objUrl, mtlUrl) {
            statusEl.style.color = '#38bdf8';
            statusEl.textContent = 'Cargando materiales (.mtl)...';

            const mtlLoader = new MTLLoader();
            mtlLoader.load(mtlUrl, (materials) => {
                materials.preload();
                statusEl.textContent = 'Cargando modelo 3D (.obj)...';

                const objLoader = new OBJLoader();
                objLoader.setMaterials(materials);
                objLoader.load(objUrl, (object) => {
                    displayModel(object, 'Taller 1° Año (Automático)');
                }, undefined, (error) => {
                    console.error(error);
                    fallbackLoadObjOnly(objUrl);
                });
            }, undefined, (error) => {
                console.warn('No se encontró el .mtl, cargando solo el .obj...', error);
                fallbackLoadObjOnly(objUrl);
            });
        }

        function fallbackLoadObjOnly(objUrl) {
            const objLoader = new OBJLoader();
            objLoader.load(objUrl, (object) => {
                object.traverse((child) => {
                    if (child.isMesh) {
                        child.material = new THREE.MeshStandardMaterial({
                            color: 0x38bdf8,
                            roughness: 0.5,
                            side: THREE.DoubleSide
                        });
                    }
                });
                displayModel(object, 'Modelo (Sin materiales)');
            });
        }

        // Procesar archivos si el usuario arrastra otros nuevos
        async function processFiles(fileList) {
            const files = Array.from(fileList);
            const objFile = files.find(f => f.name.toLowerCase().endsWith('.obj'));
            const mtlFile = files.find(f => f.name.toLowerCase().endsWith('.mtl'));

            if (!objFile) return;

            const objText = await objFile.text();
            const mtlText = mtlFile ? await mtlFile.text() : null;

            const objLoader = new OBJLoader();
            if (mtlText) {
                const mtlLoader = new MTLLoader();
                const materials = mtlLoader.parse(mtlText, '');
                materials.preload();
                objLoader.setMaterials(materials);
            }

            const object = objLoader.parse(objText);
            object.traverse((child) => {
                if (child.isMesh) {
                    if (!mtlText) {
                        child.material = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.5, side: THREE.DoubleSide });
                    } else if (child.material) {
                        child.material.side = THREE.DoubleSide;
                    }
                }
            });

            displayModel(object, objFile.name);
        }

        function displayModel(object, name) {
            if (currentMesh) {
                scene.remove(currentMesh);
            }
            currentMesh = object;
            scene.add(object);

            const box = new THREE.Box3().setFromObject(object);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);

            controls.target.copy(center);
            camera.position.set(center.x + maxDim * 1.1, center.y + maxDim * 0.9, center.z + maxDim * 1.3);
            controls.update();

            statusEl.style.color = '#4ade80';
            statusEl.textContent = `¡Cargado con éxito: ${name}!`;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
